# Configuração do broker Eclipse Mosquitto do SmartFarm
# Arquivo: /etc/mosquitto/conf.d/smartfarm.conf

# Escuta em todas as interfaces na porta padrão do MQTT
listener 1883 0.0.0.0

# Simulação acadêmica: conexões anônimas permitidas.
# Para exigir usuário e senha, troque por:
#   allow_anonymous false
#   password_file /etc/mosquitto/passwd
# e crie os usuários com: sudo mosquitto_passwd -c /etc/mosquitto/passwd <usuario>
allow_anonymous true

# Guarda as mensagens retidas (ex.: smartfarm/dispB/status) entre reinícios
persistence true
persistence_location /var/lib/mosquitto/
